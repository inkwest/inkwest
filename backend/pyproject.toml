[project]
name = "inkwest-backend"
version = "0.1.0"
description = "AI-powered Kubernetes debugging assistant backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "anthropic[bedrock]>=0.18.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "kubernetes>=28.1.0",
    "httpx>=0.26.0",
    # Structured logging with FastAPI access logs
    "fastapi-structured-logging>=0.3.0",
    "orjson>=3.9.0",
    # OpenTelemetry
    "opentelemetry-distro>=0.44b0",
    "opentelemetry-exporter-otlp>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-instrumentation-asyncpg>=0.44b0",
    "opentelemetry-instrumentation-httpx>=0.44b0",
    # JWT handling for OIDC auth — [crypto] pulls in `cryptography`, required for RS256/ES256 ID tokens
    "PyJWT[crypto]>=2.8.0",
    # AWS SSO/STS + Secrets Manager for external access connectors
    "boto3>=1.34.0",
    # Generating per-session EKS kubeconfigs (refresh_eks port)
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",  # in-memory DB for behavioral query tests
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
# Standalone agent worker: one turn from stdin (turn-spec) -> ChatEvent NDJSON on
# stdout. Spawned by the broker in the sandbox (P1.3); runnable for local dev.
inkwest-agent = "inkwest_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "inkwest_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/__init__.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
