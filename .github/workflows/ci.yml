name: CI

on:
  pull_request:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The eslint/typecheck hooks are `language: system` and need frontend/node_modules.
      - run: npm ci
        working-directory: frontend
      - uses: pre-commit/action@v3.0.1

  test-backend:
    runs-on: ubuntu-latest
    env:
      # tests/test_connector_renewal.py builds real boto3 SSO clients; without a region
      # they raise NoRegionError (dev machines get it from ~/.aws).
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Matches the prod image (root Dockerfile: python:3.11-slim).
          python-version: "3.11"
      - run: uv sync --locked --extra dev
        working-directory: backend
      - run: uv run pytest
        working-directory: backend

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Combined backend + SPA image.
          - name: inkwest
            image: ghcr.io/${{ github.repository }}
            context: .
            file: Dockerfile
          # Sandbox agent image: context is backend/ (the Dockerfile COPYs app/ +
          # inkwest_agent/), published under a sub-path of the main image.
          - name: agent
            image: ghcr.io/${{ github.repository }}/agent
            context: backend
            file: agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=match,pattern=^v\d+\.\d+\.\d+-(alpha|beta|rc),group=1
            type=ref,event=pr
            type=ref,event=branch
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            PROJECT_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: sigstore/cosign-installer@v3
        if: startsWith(github.ref, 'refs/tags/v')
      # Keyless (Fulcio + Rekor) via the job's OIDC token; single-platform build, so this
      # digest is the one a `pull by tag` resolves to.
      - run: cosign sign --yes "${{ matrix.image }}@${{ steps.build.outputs.digest }}"
        if: startsWith(github.ref, 'refs/tags/v')
