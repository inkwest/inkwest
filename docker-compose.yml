services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: inkwest-db
    environment:
      POSTGRES_USER: inkwest
      POSTGRES_PASSWORD: inkwest
      POSTGRES_DB: inkwest
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkwest"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot init: ensure the Claude CLI mount targets exist with the right
  # TYPE and ownership before the backend's bind-mounts resolve. Docker
  # auto-creates a missing *file* bind-source as a root-owned *directory*,
  # which breaks ./app_home/.claude.json (the CLI expects a file -> EISDIR).
  # An entrypoint can't fix this: mounts resolve before any container code runs.
  # Seeding from the parent-dir mount here removes the manual pre-create step.
  claude-init:
    image: busybox:1.37
    container_name: inkwest-claude-init
    user: root
    volumes:
      - ./app_home:/seed
    command:
      - sh
      - -c
      - |
        mkdir -p /seed/.claude
        # Repair a previously auto-created bogus directory at the file path.
        # A dir here can only be Docker's empty placeholder, never real config.
        [ -d /seed/.claude.json ] && rm -rf /seed/.claude.json
        [ -f /seed/.claude.json ] || echo '{}' > /seed/.claude.json
        chown -R 1000:1000 /seed
    restart: "no"

  # Python Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: inkwest-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://inkwest:inkwest@db:5432/inkwest
      # AI Provider: anthropic, bedrock, azure, openrouter, google, or claude-cli
      - AI_PROVIDER=${AI_PROVIDER:-claude-cli}
      # Anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      # AWS Bedrock
      - CLAUDE_CODE_USE_BEDROCK=${CLAUDE_CODE_USE_BEDROCK:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-}
      # Azure OpenAI
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      # Google Gemini
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-2.5-flash}
      # OpenRouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-}
      # Claude CLI
      - CLAUDE_CLI_PATH=${CLAUDE_CLI_PATH:-claude}
      - CLAUDE_CLI_TIMEOUT=${CLAUDE_CLI_TIMEOUT:-120}
      # App settings
      - APP_ENV=${APP_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-random-secret-in-production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - KUBECTL_TIMEOUT=${KUBECTL_TIMEOUT:-30}
      # OIDC Authentication
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email}
      - OIDC_ROLES_CLAIM=${OIDC_ROLES_CLAIM:-roles}
      - OIDC_ADMIN_ROLE=${OIDC_ADMIN_ROLE:-admin}
      # Budget Management
      - BUDGET_ENABLED=${BUDGET_ENABLED:-false}
      - DEFAULT_DAILY_TOKEN_LIMIT=${DEFAULT_DAILY_TOKEN_LIMIT:-100000}
      - DEFAULT_MONTHLY_TOKEN_LIMIT=${DEFAULT_MONTHLY_TOKEN_LIMIT:-2000000}
      - GLOBAL_DAILY_TOKEN_LIMIT=${GLOBAL_DAILY_TOKEN_LIMIT:-1000000}
      - GLOBAL_MONTHLY_TOKEN_LIMIT=${GLOBAL_MONTHLY_TOKEN_LIMIT:-20000000}
      # Interactive Flow
      - DEFAULT_CONFIRMATION_MODE=${DEFAULT_CONFIRMATION_MODE:-expensive}
      - DEFAULT_COST_THRESHOLD_CENTS=${DEFAULT_COST_THRESHOLD_CENTS:-10}
      - DEFAULT_ITERATION_INTERVAL=${DEFAULT_ITERATION_INTERVAL:-5}
      # Web Search
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-false}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-brave}
      - WEB_SEARCH_API_KEY=${WEB_SEARCH_API_KEY:-}
      - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-5}
      - WEB_SEARCH_TRUSTED_DOMAINS=${WEB_SEARCH_TRUSTED_DOMAINS:-}
      - WEB_SEARCH_BLOCKED_DOMAINS=${WEB_SEARCH_BLOCKED_DOMAINS:-}
      # External Access Connectors (AWS / GitLab / Coralogix)
      - CONNECTORS_ENABLED=${CONNECTORS_ENABLED:-false}
      - CONNECTOR_AUDIT_ENABLED=${CONNECTOR_AUDIT_ENABLED:-true}
      # Local dev: callback hits the backend directly (no Vite /api proxy).
      - CONNECTOR_REDIRECT_BASE=${CONNECTOR_REDIRECT_BASE:-http://localhost:8000/api/connectors/callback}
      # AWS IAM Identity Center
      - AWS_SSO_ENABLED=${AWS_SSO_ENABLED:-false}
      - AWS_SSO_START_URL=${AWS_SSO_START_URL:-}
      - AWS_SSO_REGION=${AWS_SSO_REGION:-}
      - AWS_SSO_OIDC_CLIENT_ID=${AWS_SSO_OIDC_CLIENT_ID:-}
      - AWS_SSO_OIDC_CLIENT_SECRET=${AWS_SSO_OIDC_CLIENT_SECRET:-}
      - AWS_SSO_ROLE_FILTER=${AWS_SSO_ROLE_FILTER:-}
      # GitLab OAuth (public PKCE client)
      - GITLAB_ENABLED=${GITLAB_ENABLED:-false}
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-https://gitlab.com}
      - GITLAB_OAUTH_CLIENT_ID=${GITLAB_OAUTH_CLIENT_ID:-}
      # Coralogix (read-only key from AWS Secrets Manager)
      - CORALOGIX_ENABLED=${CORALOGIX_ENABLED:-false}
      - CORALOGIX_SECRET_ID=${CORALOGIX_SECRET_ID:-}
      - CORALOGIX_SECRET_REGION=${CORALOGIX_SECRET_REGION:-}
      - CORALOGIX_API_ENDPOINT=${CORALOGIX_API_ENDPOINT:-}
      # Per-conversation Docker sandbox — talk to the dind daemon over TLS (via the
      # `docker` alias, the only name its cert is valid for). These in-container paths are
      # coupled to the mounts below; enable + image/home come from .env (SANDBOX_ENABLED,
      # SANDBOX_TOOLBOX_IMAGE, SANDBOX_HOME).
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
      - SANDBOX_ENV_FILE=/app/sandbox.env  # --env-file read by the docker client here
      - SANDBOX_SQUID_CONF=/etc/inkwest/squid.conf  # -v source resolved by dind (mounted there)
      - SANDBOX_SQUID_ERRORS=/etc/inkwest/errors  # custom error pages, sibling of the conf
      - SANDBOX_SESSIONS_ROOT=/sandbox/sessions  # the shared named volume
    volumes:
      - ./backend:/app
      - ./app_home/.claude:/home/app/.claude
      - ./app_home/.claude.json:/home/app/.claude.json
      - ${KUBECONFIG_DIR:-./kubeconfigs}:/etc/inkwest/kubeconfigs:ro
      - sandbox-dind-certs:/certs:ro  # read dind's client certs
      - sandbox-sessions:/sandbox/sessions  # same volume as dind -> truly shared
    depends_on:
      db:
        condition: service_healthy
      claude-init:
        condition: service_completed_successfully
      dind:
        condition: service_healthy
      sandbox-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: inkwest-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: npm run dev -- --host

  # ---------------------------------------------------------------------------
  # Per-conversation sandbox (DinD) — used by the claude-cli provider when
  # SANDBOX_ENABLED=true. A privileged docker:dind daemon runs the per-conversation
  # toolbox+squid pairs in isolation from the host daemon; the backend drives it over
  # TLS. Dev-only: `privileged` is not for production (k8s gets a different backend).
  # ---------------------------------------------------------------------------

  # Makes the shared session volume writable by the non-root backend (uid 1000) so it
  # can create the per-conversation dirs that dind mounts into the nested containers.
  sandbox-init:
    image: busybox
    command: ["sh", "-c", "chmod 777 /sandbox/sessions"]
    volumes:
      - sandbox-sessions:/sandbox/sessions

  dind:
    image: docker:27-dind
    privileged: true  # required to run a nested daemon
    environment:
      - DOCKER_TLS_CERTDIR=/certs  # TLS on tcp://dind:2376; client certs in /certs/client
    dns:  # the dind CONTAINER's own resolver, for image pulls
      - 1.1.1.1
      - 8.8.8.8
    command: ["--dns", "1.1.1.1"]  # daemon-wide DNS default for the nested containers
    # The dind server cert is valid for `docker`/`localhost`/the container id — NOT `dind`;
    # expose it under `docker` so the backend's TLS hostname verification passes.
    networks:
      default:
        aliases:
          - docker
    depends_on:
      sandbox-init:
        condition: service_completed_successfully
    volumes:
      - sandbox-dind-certs:/certs  # shared TLS certs (with backend)
      - sandbox-dind-data:/var/lib/docker  # persist dind's image store across restarts
      - sandbox-sessions:/sandbox/sessions  # per-conv dirs (shared with backend; nested -v sources)
      # Bind the DIRECTORY (not the single squid.conf file): a single-file bind pins an
      # inode and goes stale if the file is edited, breaking the nested proxy mount.
      - ./sandbox:/etc/inkwest:ro  # /etc/inkwest/squid.conf -> nested -v source
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
  sandbox-dind-certs:
  sandbox-dind-data:
  sandbox-sessions:
